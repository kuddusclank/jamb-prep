<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Offline Study | JAMBPrep</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      padding: 36px 32px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      margin-bottom: 20px;
    }
    .badge.reconnecting {
      background: #fffbeb;
      color: #92400e;
      border-color: #fde68a;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }
    .badge.reconnecting .badge-dot {
      background: #f59e0b;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #092E28;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    p {
      color: #475569;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 24px;
      border-radius: 9999px;
      background: #116149;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-primary:hover {
      background: #0d4e3a;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 24px;
      border-radius: 9999px;
      background: #f1f5f9;
      color: #334155;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      border: 1px solid #cbd5e1;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .status-text {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="/lecterniq-mark.svg" alt="JAMBPrep" class="logo">
    <div id="statusBadge" class="badge reconnecting">
      <span class="badge-dot"></span>
      <span id="badgeText">Detecting connection…</span>
    </div>
    <h1 id="headingText">Connecting to JAMBPrep</h1>
    <p id="descText">
      Your offline progress and weekly practice packs remain securely saved on this device. We’ll resume your session automatically as soon as internet is detected.
    </p>
    <div class="actions">
      <a href="/dashboard/" class="btn-primary" id="dashboardBtn" onclick="window.location.href='/dashboard/'; return false;">Continue to Dashboard</a>
      <button type="button" class="btn-secondary" onclick="attemptReconnect(true)">Retry Connection Now</button>
    </div>
    <p class="status-text" id="statusMessage">Checking connection in background…</p>
  </main>
  <script>
    (function() {
      var isRedirecting = false;
      var statusMsg = document.getElementById('statusMessage');
      var badge = document.getElementById('statusBadge');
      var badgeText = document.getElementById('badgeText');
      var heading = document.getElementById('headingText');

      function attemptReconnect(isManual) {
        if (isRedirecting) return;
        if (isManual && statusMsg) statusMsg.textContent = 'Checking connection now…';

        fetch('/lecterniq-mark.svg?t=' + Date.now(), { cache: 'no-store' })
          .then(function(res) {
            if (res.ok && !isRedirecting) {
              isRedirecting = true;
              if (badge) {
                badge.className = 'badge';
                if (badgeText) badgeText.textContent = 'Connected!';
              }
              if (heading) heading.textContent = 'Connected! Resuming…';
              if (statusMsg) statusMsg.textContent = 'Redirecting to your dashboard…';
              setTimeout(function() {
                window.location.replace('/dashboard/');
              }, 400);
            }
          })
          .catch(function() {
            if (isManual && statusMsg) {
              statusMsg.textContent = 'Still waiting for connection. You can continue offline below.';
            }
          });
      }

      window.addEventListener('online', function() {
        attemptReconnect(false);
      });

      // Probe connection every 1.5s so reconnection happens automatically
      setInterval(function() {
        attemptReconnect(false);
      }, 1500);

      // Check immediately on load
      attemptReconnect(false);

      // Force ServiceWorker to check for updates so new navigation logic activates
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration().then(function(reg) {
          if (reg && typeof reg.update === 'function') {
            reg.update().catch(function() {});
          }
        }).catch(function() {});
      }
    })();
  </script>
</body>
</html>
